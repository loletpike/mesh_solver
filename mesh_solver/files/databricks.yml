bundle:
  name: mesh_solver

variables:
  environment_name:
    description: "Target Unity Catalog environment (dap_prod or dap_dev)"
    default: dap_prod

artifacts:
  clean_staging_tables:
    type: whl
    build: pip wheel --no-deps -w dist .
    path: .

include:
  - resources/*.yml

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://comcast-pde.cloud.databricks.com
    presets:
      source_linked_deployment: false
    run_as:
      service_principal_name: aa7549ba-85a3-449d-b06c-cb0f1013d3ee
    variables:
      environment_name: dap_dev

  prod:
    mode: production
    workspace:
      host: https://comcast-pde.cloud.databricks.com
      root_path: /production/${bundle.target}/${bundle.name}
    run_as:
      service_principal_name: aa7549ba-85a3-449d-b06c-cb0f1013d3ee
    permissions:
      - user_name: Lolita_Pike2@comcast.com
        level: CAN_MANAGE
      - service_principal_name: aa7549ba-85a3-449d-b06c-cb0f1013d3ee
        level: CAN_MANAGE
      - group_name: users
        level: CAN_VIEW
