resources:
  jobs:
    mesh_solver_load:
      name: mesh_solver_load
      description: "Mesh Solver Replacement - Channel optimization KPI processing"
      max_concurrent_runs: 1
      queue:
        enabled: true

      schedule:
        quartz_cron_expression: "0 0 */12 * * ? *"
        timezone_id: "America/New_York"

      email_notifications:
        on_failure:
          - Lpike97@gmail.com

      tasks:
        - task_key: solver_load
          run_job_task:
            job_id: 992256875029393

        - task_key: mesh_solver_run
          depends_on:
            - task_key: solver_load
          environment_key: solver_env
          python_wheel_task:
            package_name: solver_replacement
            entry_point: main
            parameters:
              - --environment_name=${var.environment_name}

        - task_key: clean_staging_tables
          depends_on:
            - task_key: mesh_solver_run
          environment_key: clean_staging_env
          python_wheel_task:
            package_name: clean_staging_tables
            entry_point: main
            parameters:
              - --environment_name=hive_metastore
              - --tablelist=mesh_location_optimize_solver_response:7
              - --targetschema=dct

        - task_key: generate_ui_filters
          depends_on:
            - task_key: mesh_solver_run
          environment_key: generate_filter_env
          python_wheel_task:
            package_name: generate_filter
            entry_point: main
            parameters:
              - --environment_name=${var.environment_name}
              - --schema_name=mesh_wifi
              - --coretable=mesh_solver_replacement_core_summary
              - --selectiontable=mesh_solver_replacement_selections
              - --filtertable=mesh_solver_replacement_kpi_filters
              - --filterlist=gateway_model,extender_model,node_count,optimizationtype,partnerid,dfsstate,Regulatory_domain,trigger_type,device_firmware_version,app_version,solver_version,bhtype,status

      environments:
        - environment_key: solver_env
          spec:
            client: "1"
            dependencies:
              - ../dist/*.whl

        - environment_key: clean_staging_env
          spec:
            client: "1"
            dependencies:
              - /Workspace/production/prod/clean_staging_tables/artifacts/.internal/clean_staging_tables-0.2.0-py3-none-any.whl

        - environment_key: generate_filter_env
          spec:
            client: "1"
            dependencies:
              - /Workspace/production/prod/generate_ui_filters/artifacts/.internal/generate_filter-0.1.0-py3-none-any.whl
